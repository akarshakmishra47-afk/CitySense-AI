services:
  - type: web
    name: civicpulse-ai
    env: node
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # Requires manual entry in Render dashboard (e.g., MongoDB Atlas URI)
      - key: NODE_VERSION
        value: 18.17.0
      - key: GROQ_API_KEY
        sync: false # Requires manual entry in Render dashboard
      - key: JWT_SECRET
        generateValue: true
