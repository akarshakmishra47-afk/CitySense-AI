<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reports | CivicPulse AI</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="/" class="logo">CivicPulse AI</a>
      <nav>
        <a href="/report.html" data-role="citizen">Report Issue</a>
        <a href="/reports.html" class="active" data-role="citizen">My Reports</a>

      </nav>
      <div class="role-switcher" id="role-switcher"></div>

  <main class="container" style="margin-top: 2rem;">

    <div id="reports-list" class="grid grid-cols-2">

  <script src="/js/app.js"></script>

</html>
